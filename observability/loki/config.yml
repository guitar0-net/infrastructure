# Loki 3.x single-process config with filesystem storage and 14-day retention
# Ref: https://grafana.com/docs/loki/latest/configure/examples/

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 336h # 14 days
  # Cap ingestion so a runaway log loop can't flood the disk before retention kicks in
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 15
  delete_request_store: filesystem
