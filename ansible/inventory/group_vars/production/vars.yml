---
# Production environment — non-secret variables
# Secrets (passwords, tokens, keys) live in vault.yml

app_env: production

# --- Backend ---
backend_app_port: 8001
backend_db_docker_port: 5434

backend_nginx_domains:
  - server_name: api.guitar0.net
    x_frame_options: DENY
    serve_static: true
    serve_media: true
    serve_videos: true
    locations:
      - path: /admin-guitar0/
        rate_limit: general_limit
        allow_only:
          - 127.0.0.1
      - path: '~ "^/api/v1/lessons/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$"'
        rate_limit: api_limit
        cache: true
        cache_valid: 24h
      - path: /
        rate_limit: api_limit
  - server_name: admin.guitar0.net
    x_frame_options: SAMEORIGIN
    serve_static: true
    locations:
      - path: /admin-guitar0/
        rate_limit: general_limit
        burst: 10
        allow_only:
          - 91.203.143.0/24
      - path: /markdownx/
        rate_limit: general_limit
        burst: 10
        allow_only:
          - 91.203.143.0/24
      - path: /
        return: "301 /admin-guitar0/"

# In-app purchase verification
backend_google_play_package_name: com.andreykotlyar.guitar0
backend_apple_bundle_id: com.andreykotlyar.guitar0

# --- Frontend ---
frontend_app_port: 3001
frontend_api_url: api.guitar0.net
frontend_posthog_key: phc_xqKUsPeMj7WeyMsZ4pFsuswFZfrBTH7GQJZUv2WYYtRq

frontend_nginx_domains:
  - server_name: guitar0.net
    locations:
      - path: /
        rate_limit: general_limit
